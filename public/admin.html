<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ONYX Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #050505;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 92%;
      max-width: 900px;
      margin: 40px auto;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #888;
      margin-bottom: 25px;
    }

    .box {
      background: #0d0d0d;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    input,
    textarea,
    select,
    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #292929;
      background: #151515;
      color: #fff;
      font-size: 14px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      background: #fff;
      color: #000;
      border: 0;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    .danger {
      background: #b91c1c;
      color: white;
      width: auto;
      padding: 9px 14px;
    }

    .product {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 12px;
      margin-top: 10px;
      background: #111;
      border: 1px solid #222;
      border-radius: 10px;
    }

    .product img {
      width: 65px;
      height: 65px;
      object-fit: cover;
      border-radius: 8px;
      background: #181818;
    }

    .product-info {
      flex: 1;
    }

    .product-info strong {
      display: block;
      margin-bottom: 5px;
    }

    .product-info small {
      color: #888;
    }

    .sale {
      background: #111;
      border: 1px solid #222;
      border-radius: 10px;
      padding: 14px;
      margin-top: 10px;
    }

    .sale strong {
      display: block;
      margin-bottom: 6px;
    }

    .sale small {
      color: #888;
      line-height: 1.6;
    }

    .msg {
      color: #aaa;
      margin-top: 10px;
      white-space: pre-wrap;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 600px) {
      .product {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <div id="login" class="container">

    <div class="box">

      <h1>ONYX Admin</h1>

      <div class="subtitle">
        Painel administrativo
      </div>

      <input
        id="password"
        type="password"
        placeholder="Senha"
      >

      <button onclick="login()">
        Entrar
      </button>

      <div id="loginMsg" class="msg"></div>

    </div>

  </div>


  <!-- PAINEL -->
  <div id="panel" class="container hidden">

    <h1>ONYX Admin</h1>

    <div class="subtitle">
      Produtos e vendas
    </div>


    <!-- PRODUTO -->
    <div class="box">

      <h2>Novo produto</h2>

      <input
        id="name"
        placeholder="Nome do produto"
      >

      <input
        id="price"
        type="number"
        step="0.01"
        placeholder="Preço"
      >

      <select id="category">

        <option value="roblox">
          Roblox
        </option>

        <option value="fortnite">
          Fortnite
        </option>

        <option value="vbucks">
          V-Bucks
        </option>

        <option value="nitradas">
          Nitradas
        </option>

      </select>

      <input
        id="image"
        placeholder="URL da foto do produto"
      >

      <textarea
        id="description"
        placeholder="Descrição do produto"
      ></textarea>

      <button onclick="createProduct()">
        Adicionar produto
      </button>

      <div id="productMsg" class="msg"></div>

    </div>


    <!-- CATÁLOGO -->
    <div class="box">

      <h2>Catálogo</h2>

      <div id="products">
        Carregando...
      </div>

    </div>


    <!-- HISTÓRICO -->
    <div class="box">

      <h2>Histórico de vendas</h2>

      <button onclick="loadOrders()">
        Atualizar
      </button>

      <div id="orders">
        Carregando...
      </div>

    </div>

  </div>


<script>

let password = "";


/* =========================
   API
========================= */

async function api(url, options = {}) {

  options.headers = {
    "Content-Type": "application/json",
    "x-admin-password": password,
    ...(options.headers || {})
  };

  const response = await fetch(url, options);

  let data = {};

  try {
    data = await response.json();
  } catch {}

  if (!response.ok) {
    throw new Error(
      data.error || "Erro na requisição."
    );
  }

  return data;
}


/* =========================
   LOGIN
========================= */

async function login() {

  password =
    document.getElementById("password").value.trim();

  if (!password) {
    document.getElementById("loginMsg").textContent =
      "Digite a senha.";
    return;
  }

  try {

    await api("/api/admin/products");

    document
      .getElementById("login")
      .classList.add("hidden");

    document
      .getElementById("panel")
      .classList.remove("hidden");

    loadProducts();
    loadOrders();

  } catch (error) {

    password = "";

    document.getElementById("loginMsg").textContent =
      error.message;

  }
}


/* =========================
   CRIAR PRODUTO
========================= */

async function createProduct() {

  const name =
    document.getElementById("name").value.trim();

  const price =
    Number(document.getElementById("price").value);

  const category =
    document.getElementById("category").value;

  const image =
    document.getElementById("image").value.trim();

  const description =
    document.getElementById("description").value.trim();

  const msg =
    document.getElementById("productMsg");


  if (!name) {
    msg.textContent = "Digite o nome.";
    return;
  }

  if (!price || price <= 0) {
    msg.textContent = "Digite um preço válido.";
    return;
  }


  try {

    await api("/api/admin/products", {

      method: "POST",

      body: JSON.stringify({
        name,
        price,
        category,
        image,
        image_url: image,
        description
      })

    });


    msg.textContent =
      "Produto adicionado.";

    document.getElementById("name").value = "";
    document.getElementById("price").value = "";
    document.getElementById("image").value = "";
    document.getElementById("description").value = "";

    loadProducts();

  } catch (error) {

    msg.textContent =
      error.message;

  }
}


/* =========================
   CATÁLOGO
========================= */

async function loadProducts() {

  const container =
    document.getElementById("products");

  try {

    const data =
      await api("/api/admin/products");

    const products =
      Array.isArray(data)
        ? data
        : (data.products || []);


    container.innerHTML = "";


    if (!products.length) {

      container.innerHTML =
        '<div class="msg">Nenhum produto cadastrado.</div>';

      return;
    }


    products.forEach(product => {

      const div =
        document.createElement("div");

      div.className = "product";


      const img =
        document.createElement("img");

      img.src =
        product.image_url ||
        product.image ||
        "";

      img.onerror = () => {
        img.style.visibility = "hidden";
      };


      const info =
        document.createElement("div");

      info.className = "product-info";

      const price =
        Number(product.price || 0)
          .toLocaleString("pt-BR", {
            style: "currency",
            currency: "BRL"
          });


      info.innerHTML = `
        <strong>${escapeHtml(product.name)}</strong>
        <small>
          ${escapeHtml(product.category || "roblox")}
          • ${price}
        </small>
      `;


      const button =
        document.createElement("button");

      button.className = "danger";
      button.textContent = "Excluir";

      button.onclick = () =>
        deleteProduct(product.id);


      div.appendChild(img);
      div.appendChild(info);
      div.appendChild(button);

      container.appendChild(div);

    });

  } catch (error) {

    container.innerHTML =
      `<div class="msg">${escapeHtml(error.message)}</div>`;

  }
}


/* =========================
   EXCLUIR
========================= */

async function deleteProduct(id) {

  if (!confirm(
    "Excluir este produto?"
  )) {
    return;
  }


  try {

    await api(
      "/api/admin/products/" + id,
      {
        method: "DELETE"
      }
    );

    loadProducts();

  } catch (error) {

    alert(error.message);

  }
}


/* =========================
   HISTÓRICO DE VENDAS
========================= */

async function loadOrders() {

  const container =
    document.getElementById("orders");

  try {

    const data =
      await api("/api/admin/orders");

    const orders =
      Array.isArray(data)
        ? data
        : (data.orders || []);


    container.innerHTML = "";


    if (!orders.length) {

      container.innerHTML =
        '<div class="msg">Nenhuma venda registrada.</div>';

      return;
    }


    orders.forEach(order => {

      const div =
        document.createElement("div");

      div.className = "sale";


      const product =
        order.product_name ||
        order.productName ||
        order.name ||
        "Produto";


      const value =
        Number(
          order.amount ??
          order.total ??
          order.price ??
          0
        );


      const dateValue =
        order.created_at ||
        order.createdAt ||
        order.paid_at ||
        order.paidAt;


      let date = "Data não disponível";

      if (dateValue) {

        const parsed =
          new Date(dateValue);

        if (!isNaN(parsed)) {

          date =
            parsed.toLocaleString(
              "pt-BR"
            );

        }

      }


      const status =
        order.status ||
        "desconhecido";


      div.innerHTML = `
        <strong>${escapeHtml(product)}</strong>

        <small>
          Pedido: ${escapeHtml(order.id || "—")}<br>
          Valor: ${value.toLocaleString("pt-BR", {
            style: "currency",
            currency: "BRL"
          })}<br>
          Data: ${escapeHtml(date)}<br>
          Status: ${escapeHtml(status)}
        </small>
      `;


      container.appendChild(div);

    });

  } catch (error) {

    container.innerHTML =
      `<div class="msg">${escapeHtml(error.message)}</div>`;

  }
}


/* =========================
   SEGURANÇA
========================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
```

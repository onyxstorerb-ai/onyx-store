<!doctype html>

<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ONYX Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #08090b;
      color: #f5f5f5;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    .wrap {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
      padding: 35px 0 60px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 45px;
      height: 45px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #ff7a00, #ff4d00);
      color: #fff;
      font-weight: 900;
      font-size: 22px;
      box-shadow: 0 0 25px rgba(255, 100, 0, .18);
    }

    h1 {
      margin: 0;
      font-size: 25px;
      letter-spacing: .5px;
    }

    h2 {
      margin: 0 0 18px;
      font-size: 18px;
    }

    .muted {
      color: #8f949d;
      margin: 5px 0 0;
      font-size: 14px;
    }

    .box {
      background: #111318;
      border: 1px solid #242832;
      border-radius: 16px;
      padding: 22px;
      margin: 16px 0;
      box-shadow: 0 8px 35px rgba(0,0,0,.18);
    }

    .login-box {
      max-width: 480px;
      margin: 70px auto;
    }

    input,
    textarea,
    select {
      width: 100%;
      background: #090a0d;
      color: #fff;
      border: 1px solid #30343d;
      border-radius: 10px;
      padding: 12px 13px;
      outline: none;
      transition: .2s;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #ff6a00;
      box-shadow: 0 0 0 3px rgba(255,106,0,.08);
    }

    textarea {
      min-height: 95px;
      resize: vertical;
    }

    label {
      display: block;
      color: #b8bcc5;
      font-size: 13px;
      font-weight: 700;
      margin: 10px 0 6px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    button {
      background: linear-gradient(135deg, #ff7600, #ff5100);
      color: #fff;
      border: 0;
      border-radius: 10px;
      padding: 12px 17px;
      font-weight: 800;
      cursor: pointer;
      transition: .2s;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
      transform: none;
    }

    .secondary {
      background: #1b1e25;
      border: 1px solid #30343d;
    }

    .danger {
      background: #2a1515;
      border: 1px solid #542222;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .status {
      display: none;
      margin: 0 0 15px;
      padding: 12px 14px;
      border-radius: 10px;
      background: #15181e;
      border: 1px solid #292e38;
      color: #bfc4cc;
      font-size: 14px;
    }

    .status.show {
      display: block;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 16px;
    }

    .stat {
      background: #111318;
      border: 1px solid #242832;
      border-radius: 14px;
      padding: 18px;
    }

    .stat-title {
      color: #8f949d;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 25px;
      font-weight: 900;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 650px;
    }

    th {
      color: #8f949d;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    td,
    th {
      padding: 13px 10px;
      border-bottom: 1px solid #252932;
      text-align: left;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .badge {
      display: inline-flex;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .paid {
      background: #12321f;
      color: #65e69a;
    }

    .pending {
      background: #342b12;
      color: #f2c75c;
    }

    .cancelled {
      background: #351616;
      color: #ff7777;
    }

    .empty {
      padding: 25px 10px;
      text-align: center;
      color: #777d87;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 700px) {
      .wrap {
        width: min(100% - 20px, 1100px);
        padding-top: 20px;
      }

      .row,
      .stats {
        grid-template-columns: 1fr;
      }

      .top {
        align-items: flex-start;
      }

      .box {
        padding: 17px;
      }
    }
  </style>

</head>

<body>

<div class="top">
  <div class="brand">
    <div class="logo">O</div>

      <h1>ONYX ADMIN</h1>
      <p class="muted">Gerencie sua loja</p>

  <div class="stat">
    <div class="stat-title">Estoque disponível</div>

  <div class="stat">

<!-- NOVO PRODUTO -->
<div class="box">

  <h2>➕ Novo produto</h2>

  <div class="row">

    <div>
      <label for="name">Nome do produto</label>
      <input
        id="name"
        type="text"
        placeholder="Ex.: Conta Premium"
      >
    </div>

    <div>
      <label for="price">Preço</label>
      <input
        id="price"
        type="number"
        step="0.01"
        min="0"

  </div>

  <label for="desc">Descrição</label>

  <textarea
    id="desc"
    placeholder="Digite uma descrição para o produto..."
  ></textarea>

  </button>

<script>
  let pwd = '';

  const $ = id => document.getElementById(id);

  function headers() {
    return {
      'x-admin-password': pwd,
      'content-type': 'application/json'
    };
  }

  function showStatus(message, type = 'normal') {
    const el = $('status');

    el.textContent = message;
    el.className = 'status show';

    if (type === 'error') {
      el.style.borderColor = '#542222';
      el.style.color = '#ff8585';
    } else if (type === 'success') {
      el.style.borderColor = '#244d35';
      el.style.color = '#6be49a';
    } else {
      el.style.borderColor = '#292e38';
      el.style.color = '#bfc4cc';
    }

    setTimeout(() => {
      el.classList.remove('show');
    }, 3500);
  }


  function showLoginStatus(message) {
    const el = $('loginStatus');

    el.textContent = message;
    el.className = 'status show';

    el.style.borderColor = '#542222';
    el.style.color = '#ff8585';
  }


  async function login() {

    const password = $('pass').value.trim();

    if (!password) {
      showLoginStatus('Digite a senha do administrador.');
      return;
    }

    const btn = $('loginBtn');

    btn.disabled = true;
    btn.textContent = 'Entrando...';

    pwd = password;

    try {

      const response = await fetch('/api/admin/products', {
        headers: headers()
      });

      if (!response.ok) {
        pwd = '';
        showLoginStatus('Senha incorreta.');
        return;
      }

      $('login').classList.add('hidden');
      $('panel').classList.remove('hidden');

      await refresh();

    } catch (error) {

      pwd = '';
      showLoginStatus('Não foi possível conectar ao servidor.');

    } finally {

      btn.disabled = false;
      btn.textContent = 'Entrar no painel';

    }
  }


  async function addProduct() {

    const name = $('name').value.trim();
    const price = $('price').value.trim();
    const description = $('desc').value.trim();

    if (!name) {
      showStatus('Digite o nome do produto.', 'error');
      return;
    }

    if (!price || Number(price) <= 0) {
      showStatus('Digite um preço válido.', 'error');
      return;
    }

    try {

      const response = await fetch('/api/admin/products', {
        method: 'POST',
        headers: headers(),
        body: JSON.stringify({
          name,
          price,
          description
        })
      });

      if (!response.ok) {

        let message = 'Não foi possível criar o produto.';

        try {
          const data = await response.json();
          if (data.error) message = data.error;
        } catch {}

        showStatus(message, 'error');
        return;
      }

      $('name').value = '';
      $('price').value = '';
      $('desc').value = '';

      showStatus('Produto criado com sucesso!', 'success');

      await refresh();

    } catch (error) {

      showStatus('Erro de conexão.', 'error');

    }
  }


  async function addStock() {

    const productId = $('product').value;
    const account = $('account').value.trim();

    if (!productId) {
      showStatus('Crie um produto primeiro.', 'error');
      return;
    }

    if (!account) {
      showStatus('Digite a conta ou item do estoque.', 'error');
      return;
    }

    try {

      const response = await fetch('/api/admin/stock', {
        method: 'POST',
        headers: headers(),
        body: JSON.stringify({
          productId,
          account
        })
      });

      if (!response.ok) {

        let message = 'Não foi possível adicionar ao estoque.';

        try {
          const data = await response.json();
          if (data.error) message = data.error;
        } catch {}

        showStatus(message, 'error');
        return;
      }

      $('account').value = '';

      showStatus('Item adicionado ao estoque!', 'success');

      await refresh();

    } catch (error) {

      showStatus('Erro de conexão.', 'error');

    }
  }


  function statusBadge(status) {

    const value = String(status || '').toLowerCase();

    if (value === 'paid') {
      return '<span class="badge paid">Pago</span>';
    }

    if (value === 'cancelled') {
      return '<span class="badge cancelled">Cancelado</span>';
    }

    return '<span class="badge pending">Pendente</span>';
  }


  async function refresh() {

    try {

      const productResponse = await fetch(
        '/api/admin/products',
        { headers: headers() }
      );

      if (!productResponse.ok) {
        showStatus('Sessão expirada ou senha inválida.', 'error');
        logout();
        return;
      }

      const productData = await productResponse.json();

      const productList = Array.isArray(productData)
        ? productData
        : [];

      $('product').innerHTML = '';

      if (productList.length === 0) {

        $('product').innerHTML =
          '<option value="">Nenhum produto criado</option>';

      } else {

        productList.forEach(item => {

          const option = document.createElement('option');

          option.value = item.id;
          option.textContent =
            `${item.name} — ${item.stock || 0} disponível`;

          $('product').appendChild(option);

        });

      }


      let totalStock = 0;
      let totalSold = 0;

      productList.forEach(item => {

        totalStock += Number(item.stock || 0);
        totalSold += Number(item.sold || 0);

      });


      $('statProducts').textContent = productList.length;
      $('statStock').textContent = totalStock;
      $('statSold').textContent = totalSold;


      if (productList.length === 0) {

        $('products').innerHTML =
          '<div class="empty">Nenhum produto cadastrado.</div>';

      } else {

        $('products').innerHTML = `
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Produto</th>
                  <th>Disponível</th>
                  <th>Vendidas</th>
                  <th>Preço</th>
                </tr>
              </thead>

              <tbody>

                ${productList.map(item => `

                  <tr>

                    <td>
                      <strong>${escapeHtml(item.name)}</strong>
                    </td>

                    <td>
                      ${Number(item.stock || 0)}
                    </td>

                    <td>
                      ${Number(item.sold || 0)}
                    </td>

                    <td>
                      R$ ${formatPrice(item.price_cents)}
                    </td>

                  </tr>

                `).join('')}

              </tbody>
            </table>
          </div>
        `;

      }


      const orderResponse = await fetch(
        '/api/admin/orders',
        { headers: headers() }
      );

      if (!orderResponse.ok) {
        $('orders').innerHTML =
          '<div class="empty">Não foi possível carregar os pedidos.</div>';
        return;
      }

      const orderData = await orderResponse.json();

      const orderList = Array.isArray(orderData)
        ? orderData
        : [];


      if (orderList.length === 0) {

        $('orders').innerHTML =
          '<div class="empty">Nenhum pedido registrado ainda.</div>';

      } else {

        $('orders').innerHTML = `
          <div class="table-wrap">
            <table>

              <thead>
                <tr>
                  <th>Produto</th>
                  <th>Status</th>
                  <th>Valor</th>
                  <th>Data</th>
                </tr>
              </thead>

              <tbody>

                ${orderList.map(item => `

                  <tr>

                    <td>
                      ${escapeHtml(item.product || '—')}
                    </td>

                    <td>
                      ${statusBadge(item.status)}
                    </td>

                    <td>
                      R$ ${formatPrice(item.amount_cents)}
                    </td>

                    <td>
                      ${formatDate(item.created_at)}
                    </td>

                  </tr>

                `).join('')}

              </tbody>

            </table>
          </div>
        `;

      }

    } catch (error) {

      showStatus('Erro ao atualizar o painel.', 'error');

    }
  }


  function formatPrice(cents) {

    const value = Number(cents || 0) / 100;

    return value.toLocaleString('pt-BR', {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });

  }


  function formatDate(value) {

    if (!value) return '—';

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
      return value;
    }

    return date.toLocaleString('pt-BR');

  }


  function escapeHtml(value) {

    return String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');

  }


  function logout() {

    pwd = '';

    $('pass').value = '';

    $('panel').classList.add('hidden');
    $('login').classList.remove('hidden');

    $('loginStatus').classList.remove('show');

  }


  $('pass').addEventListener('keydown', function(event) {

    if (event.key === 'Enter') {
      login();
    }

  });

</script>

</body>
</html>

```html
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ONYX — Admin</title>

  <style>
    *{box-sizing:border-box}

    body{
      margin:0;
      background:#050505;
      color:#fff;
      font-family:Arial,Helvetica,sans-serif;
    }

    .wrap{
      width:min(1150px,94%);
      margin:40px auto;
    }

    h1,h2,h3{margin-top:0}

    .sub{
      color:#888;
      margin-bottom:25px;
    }

    .card{
      background:#0d0d0d;
      border:1px solid #222;
      border-radius:14px;
      padding:22px;
      margin-bottom:20px;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:14px;
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:14px;
      margin-bottom:20px;
    }

    .stat{
      background:#0d0d0d;
      border:1px solid #222;
      border-radius:14px;
      padding:20px;
    }

    .stat small{
      display:block;
      color:#888;
      margin-bottom:8px;
    }

    .stat strong{
      font-size:25px;
    }

    input,textarea,select,button{
      width:100%;
      padding:13px;
      border-radius:9px;
      border:1px solid #292929;
      background:#151515;
      color:#fff;
      font:inherit;
      outline:none;
    }

    input:focus,textarea:focus,select:focus{
      border-color:#555;
    }

    textarea{
      min-height:90px;
      resize:vertical;
    }

    button{
      cursor:pointer;
      background:#fff;
      color:#000;
      font-weight:700;
      border:0;
    }

    button:hover{opacity:.9}

    .danger{
      background:#b91c1c;
      color:#fff;
    }

    .full{
      grid-column:1/-1;
    }

    .products{
      display:grid;
      gap:12px;
    }

    .product{
      display:flex;
      align-items:center;
      gap:15px;
      background:#111;
      border:1px solid #222;
      padding:14px;
      border-radius:12px;
    }

    .product img{
      width:70px;
      height:70px;
      object-fit:cover;
      border-radius:10px;
      background:#181818;
    }

    .info{
      flex:1;
    }

    .info strong{
      display:block;
      margin-bottom:5px;
    }

    .info small{
      color:#888;
    }

    .sales{
      display:grid;
      gap:10px;
    }

    .sale{
      background:#111;
      border:1px solid #222;
      border-radius:12px;
      padding:15px;
      display:flex;
      justify-content:space-between;
      gap:15px;
      align-items:center;
    }

    .sale-left strong{
      display:block;
      margin-bottom:6px;
    }

    .sale-left small{
      color:#888;
      display:block;
      line-height:1.5;
    }

    .sale-right{
      text-align:right;
      white-space:nowrap;
    }

    .sale-right strong{
      font-size:17px;
    }

    .status{
      display:inline-block;
      margin-top:5px;
      font-size:12px;
      color:#aaa;
    }

    .login{
      max-width:420px;
      margin:100px auto;
    }

    .hidden{display:none}

    .msg{
      margin-top:12px;
      color:#aaa;
      white-space:pre-wrap;
    }

    .refresh{
      width:auto;
      padding:10px 16px;
      margin-bottom:15px;
    }

    @media(max-width:700px){
      .grid,
      .stats{
        grid-template-columns:1fr;
      }

      .product{
        align-items:flex-start;
      }

      .product button{
        width:auto;
      }

      .sale{
        align-items:flex-start;
        flex-direction:column;
      }

      .sale-right{
        text-align:left;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <div id="login" class="wrap login">
    <div class="card">
      <h1>ONYX Admin</h1>
      <div class="sub">Painel de gerenciamento</div>

      <input
        id="password"
        type="password"
        placeholder="Senha do administrador"
      >

      <br><br>

      <button onclick="login()">Entrar</button>

      <div id="loginMsg" class="msg"></div>
    </div>
  </div>


  <!-- PAINEL -->
  <div id="panel" class="wrap hidden">

    <h1>ONYX Admin</h1>
    <div class="sub">Gerencie produtos, estoque e vendas.</div>


    <!-- ESTATÍSTICAS -->
    <div class="stats">

      <div class="stat">
        <small>Vendas hoje</small>
        <strong id="todaySales">R$ 0,00</strong>
      </div>

      <div class="stat">
        <small>Pedidos hoje</small>
        <strong id="todayOrders">0</strong>
      </div>

      <div class="stat">
        <small>Total vendido</small>
        <strong id="totalSales">R$ 0,00</strong>
      </div>

    </div>


    <!-- NOVO PRODUTO -->
    <div class="card">

      <h2>Novo produto</h2>

      <div class="grid">

        <input
          id="name"
          placeholder="Nome do produto"
        >

        <input
          id="price"
          type="number"
          step="0.01"
          placeholder="Preço (ex: 29.90)"
        >

        <select id="category">
          <option value="roblox">Roblox</option>
          <option value="fortnite">Fortnite</option>
          <option value="vbucks">V-Bucks</option>
          <option value="nitradas">Nitradas</option>
        </select>

        <input
          id="image"
          placeholder="URL da imagem do produto"
        >

        <textarea
          id="description"
          class="full"
          placeholder="Descrição do produto"
        ></textarea>

      </div>

      <br>

      <button onclick="createProduct()">
        Cadastrar produto
      </button>

      <div id="productMsg" class="msg"></div>

    </div>


    <!-- ESTOQUE -->
    <div class="card">

      <h2>Adicionar estoque</h2>

      <div class="grid">

        <select id="stockProduct">
          <option value="">Selecione o produto</option>
        </select>

        <textarea
          id="stock"
          placeholder="Cole os itens do estoque, um por linha"
        ></textarea>

      </div>

      <br>

      <button onclick="addStock()">
        Adicionar estoque
      </button>

      <div id="stockMsg" class="msg"></div>

    </div>


    <!-- PRODUTOS -->
    <div class="card">

      <h2>Produtos cadastrados</h2>

      <div id="products" class="products">
        Carregando...
      </div>

    </div>


    <!-- HISTÓRICO -->
    <div class="card">

      <h2>Histórico de vendas</h2>

      <button
        class="refresh"
        onclick="loadOrders()"
      >
        Atualizar histórico
      </button>

      <div id="sales" class="sales">
        Carregando...
      </div>

    </div>

  </div>


<script>

let adminPassword = "";


/* =========================
   API
========================= */

async function api(url, options = {}) {

  options.headers = {
    "Content-Type": "application/json",
    "x-admin-password": adminPassword,
    ...(options.headers || {})
  };

  const response = await fetch(url, options);

  let data = {};

  try {
    data = await response.json();
  } catch {}

  if (!response.ok) {
    throw new Error(
      data.error || "Erro na requisição."
    );
  }

  return data;
}


/* =========================
   LOGIN
========================= */

async function login() {

  const password =
    document.getElementById("password").value.trim();

  if (!password) {
    document.getElementById("loginMsg").textContent =
      "Digite a senha.";
    return;
  }

  adminPassword = password;

  try {

    await api("/api/admin/products");

    document
      .getElementById("login")
      .classList.add("hidden");

    document
      .getElementById("panel")
      .classList.remove("hidden");

    await loadProducts();
    await loadOrders();

  } catch(error) {

    adminPassword = "";

    document.getElementById("loginMsg").textContent =
      error.message;

  }
}


/* =========================
   PRODUTOS
========================= */

async function loadProducts() {

  const container =
    document.getElementById("products");

  const select =
    document.getElementById("stockProduct");

  try {

    const data =
      await api("/api/admin/products");

    const products =
      Array.isArray(data)
        ? data
        : (data.products || []);

    container.innerHTML = "";

    select.innerHTML =
      '<option value="">Selecione o produto</option>';


    if (!products.length) {

      container.innerHTML =
        '<div class="sub">Nenhum produto cadastrado.</div>';

      return;
    }


    products.forEach(product => {

      const option =
        document.createElement("option");

      option.value = product.id;
      option.textContent = product.name;

      select.appendChild(option);


      const item =
        document.createElement("div");

      item.className = "product";


      const image =
        document.createElement("img");

      image.src =
        product.image_url ||
        product.image ||
        "";

      image.onerror = () => {
        image.style.visibility = "hidden";
      };


      const info =
        document.createElement("div");

      info.className = "info";

      const price =
        Number(product.price || 0)
          .toFixed(2)
          .replace(".", ",");


      info.innerHTML = `
        <strong>${escapeHtml(product.name)}</strong>
        <small>
          ${escapeHtml(product.category || "roblox")}
          • R$ ${price}
          • Estoque: ${product.stock ?? 0}
        </small>
      `;


      const button =
        document.createElement("button");

      button.className = "danger";
      button.textContent = "Excluir";

      button.onclick = () =>
        deleteProduct(product.id);


      item.appendChild(image);
      item.appendChild(info);
      item.appendChild(button);

      container.appendChild(item);

    });

  } catch(error) {

    container.innerHTML =
      `<div class="msg">${escapeHtml(error.message)}</div>`;

  }
}


/* =========================
   CRIAR PRODUTO
========================= */

async function createProduct() {

  const name =
    document.getElementById("name").value.trim();

  const price =
    Number(document.getElementById("price").value);

  const category =
    document.getElementById("category").value;

  const image =
    document.getElementById("image").value.trim();

  const description =
    document.getElementById("description").value.trim();

  const msg =
    document.getElementById("productMsg");


  if (!name) {
    msg.textContent =
      "Digite o nome do produto.";
    return;
  }

  if (!price || price <= 0) {
    msg.textContent =
      "Digite um preço válido.";
    return;
  }


  try {

    await api("/api/admin/products", {

      method:"POST",

      body:JSON.stringify({

        name,
        price,
        category,
        image,
        description

      })

    });


    msg.textContent =
      "Produto cadastrado com sucesso.";

    document.getElementById("name").value = "";
    document.getElementById("price").value = "";
    document.getElementById("image").value = "";
    document.getElementById("description").value = "";


    await loadProducts();

  } catch(error) {

    msg.textContent =
      error.message;

  }
}


/* =========================
   ESTOQUE
========================= */

async function addStock() {

  const productId =
    document.getElementById("stockProduct").value;

  const stockText =
    document.getElementById("stock").value;

  const msg =
    document.getElementById("stockMsg");


  if (!productId) {
    msg.textContent =
      "Selecione um produto.";
    return;
  }


  const items =
    stockText
      .split("\n")
      .map(x => x.trim())
      .filter(Boolean);


  if (!items.length) {
    msg.textContent =
      "Cole pelo menos um item.";
    return;
  }


  try {

    await api("/api/admin/stock", {

      method:"POST",

      body:JSON.stringify({

        product_id:Number(productId),
        items

      })

    });


    msg.textContent =
      `${items.length} item(ns) adicionados ao estoque.`;

    document.getElementById("stock").value = "";

    await loadProducts();

  } catch(error) {

    msg.textContent =
      error.message;

  }
}


/* =========================
   EXCLUIR PRODUTO
========================= */

async function deleteProduct(id) {

  if (!confirm(
    "Tem certeza que deseja excluir este produto?"
  )) {
    return;
  }


  try {

    await api(
      "/api/admin/products/" + id,
      {
        method:"DELETE"
      }
    );

    await loadProducts();

  } catch(error) {

    alert(error.message);

  }
}


/* =========================
   HISTÓRICO DE VENDAS
========================= */

async function loadOrders() {

  const container =
    document.getElementById("sales");


  try {

    const data =
      await api("/api/admin/orders");


    const orders =
      Array.isArray(data)
        ? data
        : (data.orders || []);


    let todayTotal = 0;
    let todayCount = 0;
    let total = 0;


    const now = new Date();


    orders.forEach(order => {

      const value =
        Number(
          order.amount ??
          order.price ??
          order.total ??
          0
        );


      const dateValue =
        order.created_at ??
        order.createdAt ??
        order.paid_at ??
        order.paidAt;


      const date =
        dateValue
          ? new Date(dateValue)
          : null;


      total += value;


      if (
        date &&
        date.getDate() === now.getDate() &&
        date.getMonth() === now.getMonth() &&
        date.getFullYear() === now.getFullYear()
      ) {

        todayTotal += value;
        todayCount++;

      }

    });


    document.getElementById("todaySales")
      .textContent =
        money(todayTotal);


    document.getElementById("todayOrders")
      .textContent =
        todayCount;


    document.getElementById("totalSales")
      .textContent =
        money(total);


    container.innerHTML = "";


    if (!orders.length) {

      container.innerHTML =
        '<div class="sub">Nenhuma venda registrada.</div>';

      return;
    }


    orders.forEach(order => {

      const value =
        Number(
          order.amount ??
          order.price ??
          order.total ??
          0
        );


      const dateValue =
        order.created_at ??
        order.createdAt ??
        order.paid_at ??
        order.paidAt;


      const date =
        dateValue
          ? new Date(dateValue)
          : null;


      const product =
        order.product_name ??
        order.productName ??
        order.name ??
        "Produto";


      const status =
        order.status ??
        "unknown";


      const item =
        document.createElement("div");

      item.className = "sale";


      const left =
        document.createElement("div");

      left.className = "sale-left";


      const title =
        document.createElement("strong");

      title.textContent =
        product;


      const details =
        document.createElement("small");

      details.textContent =
        "Pedido #" +
        (order.id ?? "—") +
        (date
          ? " • " + formatDate(date)
          : "");


      const statusText =
        document.createElement("span");

      statusText.className = "status";

      statusText.textContent =
        "Status: " + status;


      left.appendChild(title);
      left.appendChild(details);
      left.appendChild(statusText);


      const right =
        document.createElement("div");

      right.className = "sale-right";


      const price =
        document.createElement("strong");

      price.textContent =
        money(value);


      right.appendChild(price);


      item.appendChild(left);
      item.appendChild(right);


      container.appendChild(item);

    });


  } catch(error) {

    container.innerHTML =
      `<div class="msg">${escapeHtml(error.message)}</div>`;

  }
}


/* =========================
   FORMATADORES
========================= */

function money(value) {

  return Number(value || 0)
    .toLocaleString("pt-BR", {
      style:"currency",
      currency:"BRL"
    });

}


function formatDate(date) {

  return date.toLocaleString(
    "pt-BR",
    {
      dateStyle:"short",
      timeStyle:"short"
    }
  );

}


function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

</script>

</body>
</html>

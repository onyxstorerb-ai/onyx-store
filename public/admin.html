<script>

let ADMIN_PASSWORD =
  localStorage.getItem("onyx_admin_password") || "";

let products = [];
let orders = [];
let editingId = null;

const $ = id => document.getElementById(id);


/* =========================
   API
========================= */

function headers(){

  return {
    "Content-Type":"application/json",
    "x-admin-password":ADMIN_PASSWORD
  };

}


async function api(url,options={}){

  const res = await fetch(url,{
    cache:"no-store",
    ...options,
    headers:{
      ...headers(),
      ...(options.headers || {})
    }
  });

  if(!res.ok){

    let message =
      "Erro na operação.";

    try{

      const data =
        await res.json();

      message =
        data.error ||
        data.message ||
        message;

    }catch{}

    throw new Error(message);

  }

  try{

    return await res.json();

  }catch{

    return {};

  }

}


/* =========================
   MONEY
========================= */

function money(value){

  const n = Number(value);

  if(!Number.isFinite(n)){
    return "R$ 0,00";
  }

  return n.toLocaleString("pt-BR",{
    style:"currency",
    currency:"BRL"
  });

}


/*
  Normaliza o valor do pedido.

  Prioridade:
  1. amount_cents -> centavos
  2. amount
  3. price

  Se "amount" vier absurdamente alto,
  tratamos como centavos para evitar
  faturamento de bilhões por erro de unidade.
*/

function getOrderAmount(order){

  if(!order){
    return 0;
  }


  if(
    order.amount_cents !== undefined &&
    order.amount_cents !== null &&
    order.amount_cents !== ""
  ){

    const cents =
      Number(order.amount_cents);

    if(
      Number.isFinite(cents) &&
      cents >= 0
    ){

      return cents / 100;

    }

  }


  if(
    order.amount !== undefined &&
    order.amount !== null &&
    order.amount !== ""
  ){

    const amount =
      Number(order.amount);

    if(
      Number.isFinite(amount) &&
      amount >= 0
    ){

      /*
        Valores muito grandes normalmente
        significam centavos vindos da API.

        Exemplo:
        1000 -> R$10,00
        5000 -> R$50,00

        Valores normais continuam em reais.
      */

      if(amount >= 1000000){
        return amount / 100;
      }

      /*
        Corrige casos como:
        1000 = R$10,00
        5000 = R$50,00
        10000 = R$100,00

        Mas não altera:
        10 = R$10,00
        50 = R$50,00
        100 = R$100,00
      */

      if(
        Number.isInteger(amount) &&
        amount >= 1000
      ){

        return amount / 100;

      }

      return amount;

    }

  }


  if(
    order.price !== undefined &&
    order.price !== null &&
    order.price !== ""
  ){

    const price =
      Number(order.price);

    if(
      Number.isFinite(price) &&
      price >= 0
    ){

      if(
        Number.isInteger(price) &&
        price >= 1000
      ){

        return price / 100;

      }

      return price;

    }

  }


  return 0;

}


function getProductPrice(product){

  if(
    product &&
    product.price_cents !== undefined &&
    product.price_cents !== null
  ){

    const cents =
      Number(product.price_cents);

    return Number.isFinite(cents)
      ? cents / 100
      : 0;

  }


  const price =
    Number(product?.price || 0);

  return Number.isFinite(price)
    ? price
    : 0;

}


function getProductStock(p){

  return Number(
    p?.stock ??
    p?.stock_count ??
    p?.inventory_count ??
    p?.available ??
    0
  ) || 0;

}


/* =========================
   STATUS DOS PEDIDOS
========================= */

/*
  SOMENTE estes estados entram
  no faturamento e na quantidade
  de vendas.

  Pending / created / waiting / unpaid
  NÃO entram.
*/

function isPaidOrder(order){

  if(!order){
    return false;
  }


  const status = String(
    order.status ??
    order.payment_status ??
    order.paymentStatus ??
    ""
  )
  .trim()
  .toLowerCase();


  const paidStatuses = [
    "paid",
    "completed",
    "complete",
    "approved",
    "confirmed",
    "success",
    "succeeded",
    "finished"
  ];


  if(
    paidStatuses.includes(status)
  ){

    return true;

  }


  /*
    Algumas versões podem não retornar
    status, mas retornam paid_at quando
    o pagamento foi confirmado.
  */

  if(
    !status &&
    (
      order.paid_at ||
      order.paidAt ||
      order.payment_confirmed_at ||
      order.paymentConfirmedAt
    )
  ){

    return true;

  }


  return false;

}


function getPaidOrders(){

  return orders.filter(
    order => isPaidOrder(order)
  );

}


/* =========================
   LOGIN
========================= */

async function login(){

  const pass =
    $("password").value.trim();

  if(!pass){

    $("loginError").textContent =
      "Digite a senha.";

    return;

  }

  ADMIN_PASSWORD = pass;

  try{

    const res =
      await fetch(
        "/api/admin/products",
        {
          headers:{
            "x-admin-password":
              ADMIN_PASSWORD,

            "Cache-Control":
              "no-cache"
          }
        }
      );

    if(!res.ok){

      throw new Error(
        "Senha inválida."
      );

    }

    localStorage.setItem(
      "onyx_admin_password",
      ADMIN_PASSWORD
    );

    $("login").classList.add(
      "hidden"
    );

    $("admin").classList.remove(
      "hidden"
    );

    $("loginError").textContent = "";

    await loadAll();

  }catch(e){

    ADMIN_PASSWORD = "";

    $("loginError").textContent =
      e.message ||
      "Erro ao entrar.";

  }

}


function logout(){

  localStorage.removeItem(
    "onyx_admin_password"
  );

  ADMIN_PASSWORD = "";

  $("admin").classList.add(
    "hidden"
  );

  $("login").classList.remove(
    "hidden"
  );

  $("password").value = "";

}


/* =========================
   LOAD
========================= */

async function loadAll(){

  try{

    const [
      productsData,
      ordersData
    ] = await Promise.all([

      api(
        "/api/admin/products"
      ),

      api(
        "/api/admin/orders"
      )

    ]);


    products =
      Array.isArray(productsData)
      ? productsData
      : (
          productsData.products ||
          []
        );


    orders =
      Array.isArray(ordersData)
      ? ordersData
      : (
          ordersData.orders ||
          []
        );


    renderProducts();
    renderOrders();
    updateStats();

  }catch(e){

    alert(
      e.message ||
      "Erro ao carregar o painel."
    );

  }

}


/* =========================
   PRODUCTS
========================= */

function renderProducts(){

  const box =
    $("products");

  if(!products.length){

    box.innerHTML = `
      <div class="empty">
        Nenhum produto cadastrado.
      </div>
    `;

    return;

  }


  box.innerHTML =
    products.map(p => {

      const id =
        p.id;

      const image =
        p.image_url ||
        p.image ||
        "";

      const category =
        normalizeCategory(
          p.category ||
          "roblox"
        );

      const stock =
        getProductStock(p);

      const price =
        getProductPrice(p);

      const stockClass =
        stock > 0
        ? "stock-good"
        : "stock-empty";


      return `

        <article class="product">

          <div class="product-image">

            ${
              image

              ? `
                <img
                  src="${escapeHtml(image)}"
                  alt="${escapeHtml(p.name || "Produto")}"
                  onerror="
                    this.style.display='none';
                    this.nextElementSibling.style.display='flex';
                  "
                >

                <div
                  class="no-image"
                  style="display:none"
                >
                  SEM IMAGEM
                </div>
              `

              : `
                <div class="no-image">
                  SEM IMAGEM
                </div>
              `
            }

          </div>


          <div class="product-content">

            <div class="product-top">

              <div>

                <div class="product-name">
                  ${escapeHtml(
                    p.name ||
                    "Sem nome"
                  )}
                </div>

                <span class="category">
                  ${escapeHtml(
                    categoryName(category)
                  )}
                </span>

              </div>

            </div>


            <div class="product-price">
              ${money(price)}
            </div>


            <div class="product-meta">

              <span class="
                stock-badge
                ${stockClass}
              ">

                <span class="stock-dot"></span>

                ${stock} ${
                  stock === 1
                  ? "item"
                  : "itens"
                }

              </span>

            </div>


            ${
              p.description

              ? `
                <p class="product-description">
                  ${escapeHtml(
                    p.description
                  )}
                </p>
              `

              : ""
            }


            <div class="product-actions">

              <button
                class="btn dark small"
                onclick="
                  openEditProduct(
                    '${encodeURIComponent(
                      String(id)
                    )}'
                  )
                "
              >
                Editar
              </button>


              <button
                class="btn dark small"
                onclick="
                  openStock(
                    '${encodeURIComponent(
                      String(id)
                    )}'
                  )
                "
              >
                Estoque
              </button>

            </div>


            <button
              class="btn danger small full product-delete"
              onclick="
                deleteProduct(
                  '${encodeURIComponent(
                    String(id)
                  )}'
                )
              "
            >
              Excluir produto
            </button>

          </div>

        </article>

      `;

    }).join("");

}


/* =========================
   ORDERS
========================= */

function renderOrders(){

  const box =
    $("orders");


  /*
    IMPORTANTE:
    O histórico agora mostra SOMENTE
    pedidos realmente pagos.
  */

  const paidOrders =
    getPaidOrders();


  if(!paidOrders.length){

    box.innerHTML = `
      <div class="empty">
        Nenhuma venda paga registrada.
      </div>
    `;

    return;

  }


  box.innerHTML =
    paidOrders
      .slice(0,50)
      .map(order => {

        const amount =
          getOrderAmount(order);

        const product =
          order.product_name ||
          order.product ||
          order.name ||
          "Produto";

        const status =
          order.status ||
          order.payment_status ||
          "paid";

        const date =
          order.paid_at ||
          order.paidAt ||
          order.created_at ||
          order.updated_at;


        return `

          <div class="order">

            <div class="order-top">

              <div class="order-product">
                ${escapeHtml(product)}
              </div>

              <div class="order-value">
                ${money(amount)}
              </div>

            </div>


            <div class="order-info">

              <span class="
                status
                status-paid
              ">

                <span class="status-dot"></span>

                Pago

              </span>


              ${
                date

                ? `
                  <span>
                    ${formatDate(date)}
                  </span>
                `

                : ""
              }

            </div>

          </div>

        `;

      })
      .join("");

}


/* =========================
   STATS
========================= */

function updateStats(){

  $("statProducts")
    .textContent =
      products.length;


  $("statStock")
    .textContent =
      products.reduce(
        (total,p) =>
          total +
          getProductStock(p),
        0
      );


  /*
    SOMENTE PEDIDOS PAGOS.
  */

  const paidOrders =
    getPaidOrders();


  $("statOrders")
    .textContent =
      paidOrders.length;


  /*
    SOMENTE FATURAMENTO REAL.
  */

  const revenue =
    paidOrders.reduce(
      (total,order) => {

        const value =
          getOrderAmount(order);

        /*
          Proteção extra contra
          valores absurdos vindos
          de algum registro quebrado.
        */

        if(
          !Number.isFinite(value) ||
          value < 0 ||
          value > 1000000
        ){

          return total;

        }

        return total + value;

      },
      0
    );


  $("statRevenue")
    .textContent =
      money(revenue);

}


/* =========================
   PRODUCT MODAL
========================= */

function openProductModal(){

  editingId = null;

  $("modalTitle")
    .textContent =
      "Novo produto";

  $("productId")
    .value = "";

  $("productName")
    .value = "";

  $("productPrice")
    .value = "";

  $("productCategory")
    .value = "roblox";

  $("productImage")
    .value = "";

  $("productDescription")
    .value = "";

  $("deleteFromModal")
    .classList.add("hidden");

  $("productModal")
    .classList.add("show");

}


function openEditProduct(encodedId){

  const id =
    decodeURIComponent(
      encodedId
    );

  const p =
    products.find(
      x =>
        String(x.id) ===
        String(id)
    );

  if(!p) return;

  editingId = id;

  $("modalTitle")
    .textContent =
      "Editar produto";

  $("productId")
    .value = id;

  $("productName")
    .value =
      p.name || "";

  $("productPrice")
    .value =
      getProductPrice(p);

  $("productCategory")
    .value =
      normalizeCategory(
        p.category ||
        "roblox"
      );

  $("productImage")
    .value =
      p.image_url ||
      p.image ||
      "";

  $("productDescription")
    .value =
      p.description ||
      "";

  $("deleteFromModal")
    .classList.remove(
      "hidden"
    );

  $("productModal")
    .classList.add(
      "show"
    );

}


/* =========================
   SAVE PRODUCT
========================= */

async function saveProduct(){

  const name =
    $("productName")
      .value
      .trim();

  const price =
    Number(
      $("productPrice").value
    );

  const category =
    normalizeCategory(
      $("productCategory")
        .value
    );

  const image =
    $("productImage")
      .value
      .trim();

  const description =
    $("productDescription")
      .value
      .trim();


  if(!name){

    alert(
      "Digite o nome do produto."
    );

    return;

  }


  if(
    !Number.isFinite(price) ||
    price < 0
  ){

    alert(
      "Digite um preço válido."
    );

    return;

  }


  const payload = {

    name,

    price,

    category,

    image,

    image_url:image,

    description

  };


  try{

    if(editingId){

      await api(
        `/api/admin/products/${encodeURIComponent(
          editingId
        )}`,
        {
          method:"PUT",
          body:
            JSON.stringify(
              payload
            )
        }
      );

    }else{

      await api(
        "/api/admin/products",
        {
          method:"POST",
          body:
            JSON.stringify(
              payload
            )
        }
      );

    }


    closeModal();

    await loadAll();

  }catch(e){

    alert(
      e.message ||
      "Não foi possível salvar o produto."
    );

  }

}


/* =========================
   DELETE
========================= */

async function deleteCurrentProduct(){

  if(!editingId)
    return;

  await deleteProduct(
    encodeURIComponent(
      editingId
    )
  );

  closeModal();

}


async function deleteProduct(encodedId){

  const id =
    decodeURIComponent(
      encodedId
    );

  const p =
    products.find(
      x =>
        String(x.id) ===
        String(id)
    );


  if(!confirm(
    `Excluir "${p?.name || "este produto"}"?`
  )){

    return;

  }


  try{

    await api(
      `/api/admin/products/${encodeURIComponent(
        id
      )}`,
      {
        method:"DELETE"
      }
    );


    await loadAll();

  }catch(e){

    alert(
      e.message ||
      "Erro ao excluir produto."
    );

  }

}


/* =========================
   STOCK
========================= */

function openStock(encodedId){

  const id =
    decodeURIComponent(
      encodedId
    );

  const select =
    $("stockProduct");


  select.innerHTML =
    products
      .map(p => `

        <option
          value="${escapeHtml(
            String(p.id)
          )}"
          ${
            String(p.id) ===
            String(id)
            ? "selected"
            : ""
          }
        >
          ${escapeHtml(
            p.name ||
            "Produto"
          )}
        </option>

      `)
      .join("");


  $("stockItems")
    .value = "";


  $("stockModal")
    .classList.add(
      "show"
    );

}


async function saveStock(){

  const productId =
    $("stockProduct")
      .value;

  const text =
    $("stockItems")
      .value
      .trim();


  if(!productId){

    alert(
      "Selecione um produto."
    );

    return;

  }


  if(!text){

    alert(
      "Adicione pelo menos um item."
    );

    return;

  }


  const items =
    text
      .split(/\r?\n/)
      .map(
        x => x.trim()
      )
      .filter(Boolean);


  try{

    for(
      const account
      of items
    ){

      await api(
        "/api/admin/stock",
        {
          method:"POST",

          body:
            JSON.stringify({
              productId,
              account
            })
        }
      );

    }


    closeStockModal();

    await loadAll();


    alert(
      `${items.length} item(ns) adicionado(s) ao estoque.`
    );

  }catch(e){

    alert(
      e.message ||
      "Erro ao adicionar estoque."
    );

  }

}


/* =========================
   HELPERS
========================= */

function normalizeCategory(category){

  const value =
    String(
      category ||
      "roblox"
    )
    .toLowerCase()
    .trim();


  if(
    value === "v-bucks" ||
    value === "v_bucks" ||
    value === "v bucks"
  ){

    return "vbucks";

  }


  return value;

}


function categoryName(category){

  const names = {

    roblox:"Roblox",

    fortnite:"Fortnite",

    vbucks:"V-Bucks",

    nitradas:"Nitradas"

  };


  return (
    names[category] ||
    category
  );

}


function closeModal(){

  $("productModal")
    .classList.remove(
      "show"
    );

}


function closeStockModal(){

  $("stockModal")
    .classList.remove(
      "show"
    );

}


function scrollToSection(id){

  const element =
    document.getElementById(id);

  if(element){

    element.scrollIntoView({
      behavior:"smooth",
      block:"start"
    });

  }

}


function formatDate(value){

  const d =
    new Date(value);


  if(
    Number.isNaN(
      d.getTime()
    )
  ){

    return escapeHtml(
      String(value)
    );

  }


  return d.toLocaleString(
    "pt-BR"
  );

}


function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =========================
   CLOSE MODAL OUTSIDE
========================= */

$("productModal")
  .addEventListener(
    "click",
    function(e){

      if(
        e.target ===
        this
      ){

        closeModal();

      }

    }
  );


$("stockModal")
  .addEventListener(
    "click",
    function(e){

      if(
        e.target ===
        this
      ){

        closeStockModal();

      }

    }
  );


document.addEventListener(
  "keydown",
  function(e){

    if(
      e.key === "Escape"
    ){

      closeModal();
      closeStockModal();

    }

  }
);


/* =========================
   AUTO LOGIN
========================= */

if(ADMIN_PASSWORD){

  fetch(
    "/api/admin/products",
    {
      headers:{
        "x-admin-password":
          ADMIN_PASSWORD,

        "Cache-Control":
          "no-cache"
      }
    }
  )

  .then(res => {

    if(!res.ok){

      throw new Error();

    }


    $("login")
      .classList.add(
        "hidden"
      );

    $("admin")
      .classList.remove(
        "hidden"
      );


    return loadAll();

  })

  .catch(() => {

    localStorage.removeItem(
      "onyx_admin_password"
    );

    ADMIN_PASSWORD = "";

  });

}

</script>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ONYX — Admin</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#050505;
  color:#f5f5f5;
  font-family:Arial,Helvetica,sans-serif;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}

.wrap{
  width:min(1100px,94%);
  margin:30px auto;
}

.login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.card{
  background:#0d0d0d;
  border:1px solid #202020;
  border-radius:16px;
  padding:22px;
  box-shadow:0 15px 50px #000;
}

.login .card{
  width:100%;
  max-width:390px;
}

h1,h2,h3{margin-top:0}

.logo{
  font-size:28px;
  font-weight:900;
  letter-spacing:2px;
}

.muted{
  color:#888;
  font-size:14px;
}

input,textarea,select{
  width:100%;
  background:#080808;
  border:1px solid #292929;
  color:#fff;
  border-radius:10px;
  padding:12px;
  outline:none;
}

input:focus,textarea:focus,select:focus{
  border-color:#555;
}

textarea{
  min-height:110px;
  resize:vertical;
}

label{
  display:block;
  margin:14px 0 7px;
  color:#aaa;
  font-size:13px;
}

.btn{
  border:0;
  border-radius:10px;
  padding:12px 16px;
  background:#fff;
  color:#000;
  font-weight:800;
}

.btn.dark{
  background:#171717;
  color:#fff;
  border:1px solid #292929;
}

.btn.danger{
  background:#351010;
  color:#ff8585;
  border:1px solid #632020;
}

.btn.full{width:100%}

.hidden{display:none!important}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:22px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:22px;
}

.stat{
  background:#0d0d0d;
  border:1px solid #202020;
  border-radius:14px;
  padding:18px;
}

.stat b{
  display:block;
  font-size:25px;
  margin-top:7px;
}

.section{
  margin-top:18px;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:14px;
}

.product{
  background:#0d0d0d;
  border:1px solid #202020;
  border-radius:14px;
  overflow:hidden;
}

.product img{
  width:100%;
  height:150px;
  object-fit:cover;
  background:#080808;
}

.product-body{
  padding:15px;
}

.product-name{
  font-weight:800;
  font-size:17px;
}

.tag{
  display:inline-block;
  margin-top:8px;
  padding:5px 8px;
  border-radius:7px;
  background:#171717;
  color:#aaa;
  font-size:11px;
}

.price{
  margin-top:10px;
  font-size:20px;
  font-weight:900;
}

.stock{
  color:#aaa;
  font-size:13px;
  margin-top:6px;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:14px;
}

.actions button{
  flex:1;
}

.orders{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.order{
  background:#0d0d0d;
  border:1px solid #202020;
  border-radius:12px;
  padding:15px;
}

.order-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.green{color:#70e090}

.modal{
  position:fixed;
  inset:0;
  background:#000b;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:20;
}

.modal.show{display:flex}

.modal-box{
  width:min(520px,100%);
  max-height:90vh;
  overflow:auto;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

hr{
  border:0;
  border-top:1px solid #202020;
  margin:18px 0;
}

.empty{
  color:#777;
  padding:25px;
  text-align:center;
  border:1px dashed #292929;
  border-radius:12px;
}

@media(max-width:700px){
  .grid{grid-template-columns:1fr 1fr}
  .row{grid-template-columns:1fr}
}

@media(max-width:430px){
  .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="login">
  <div class="card">
    <div class="logo">ONYX</div>
    <p class="muted">Painel administrativo</p>

    <label>Senha</label>
    <input id="password" type="password" placeholder="Digite a senha">

    <br><br>
    <button class="btn full" onclick="login()">Entrar</button>

    <p id="loginError" class="muted"></p>
  </div>
</div>


<!-- ADMIN -->
<div id="admin" class="hidden">
  <div class="wrap">

    <div class="top">
      <div>
        <div class="logo">ONYX ADMIN</div>
        <div class="muted">Gerencie produtos, estoque e vendas.</div>
      </div>

      <button class="btn dark" onclick="logout()">Sair</button>
    </div>


    <!-- STATS -->
    <div class="grid">
      <div class="stat">
        <span class="muted">Produtos</span>
        <b id="statProducts">0</b>
      </div>

      <div class="stat">
        <span class="muted">Estoque</span>
        <b id="statStock">0</b>
      </div>

      <div class="stat">
        <span class="muted">Vendas</span>
        <b id="statOrders">0</b>
      </div>

      <div class="stat">
        <span class="muted">Faturamento</span>
        <b id="statRevenue">R$ 0,00</b>
      </div>
    </div>


    <!-- PRODUTOS -->
    <div class="section card">

      <div class="top">
        <div>
          <h2>Produtos</h2>
          <div class="muted">Produtos disponíveis no catálogo.</div>
        </div>

        <button class="btn" onclick="openProductModal()">
          + Produto
        </button>
      </div>

      <div id="products" class="products">
        <div class="empty">Carregando...</div>
      </div>

    </div>


    <!-- PEDIDOS -->
    <div class="section card">

      <h2>Histórico de vendas</h2>
      <div class="muted">Últimos pedidos registrados.</div>

      <br>

      <div id="orders" class="orders">
        <div class="empty">Carregando...</div>
      </div>

    </div>

  </div>
</div>


<!-- PRODUTO -->
<div id="productModal" class="modal">
  <div class="modal-box card">

    <div class="top">
      <h2 id="modalTitle">Novo produto</h2>
      <button class="btn dark" onclick="closeModal()">Fechar</button>
    </div>

    <input id="productId" type="hidden">

    <label>Nome</label>
    <input id="productName" placeholder="Ex: Conta Roblox">

    <div class="row">

      <div>
        <label>Preço (R$)</label>
        <input id="productPrice" type="number" step="0.01" min="0" placeholder="10.00">
      </div>

      <div>
        <label>Categoria</label>
        <select id="productCategory">
          <option value="roblox">Roblox</option>
          <option value="fortnite">Fortnite</option>
          <option value="v-bucks">V-Bucks</option>
          <option value="nitradas">Nitradas</option>
        </select>
      </div>

    </div>

    <label>URL da imagem</label>
    <input id="productImage" placeholder="https://...">

    <label>Descrição</label>
    <textarea id="productDescription" placeholder="Descrição do produto"></textarea>

    <br>

    <button class="btn full" onclick="saveProduct()">
      Salvar produto
    </button>

    <br><br>

    <button id="deleteFromModal" class="btn danger full hidden" onclick="deleteCurrentProduct()">
      Excluir produto
    </button>

  </div>
</div>


<!-- ESTOQUE -->
<div id="stockModal" class="modal">
  <div class="modal-box card">

    <div class="top">
      <h2>Adicionar estoque</h2>
      <button class="btn dark" onclick="closeStockModal()">Fechar</button>
    </div>

    <label>Produto</label>
    <select id="stockProduct"></select>

    <label>Contas / itens</label>
    <textarea id="stockItems" placeholder="Uma conta/item por linha"></textarea>

    <br>

    <button class="btn full" onclick="saveStock()">
      Adicionar estoque
    </button>

  </div>
</div>


<script>
let ADMIN_PASSWORD = localStorage.getItem("onyx_admin_password") || "";
let products = [];
let orders = [];
let editingId = null;

const $ = id => document.getElementById(id);

function headers(){
  return {
    "Content-Type":"application/json",
    "x-admin-password":ADMIN_PASSWORD
  };
}

function money(value){
  let n = Number(value || 0);

  // Backend normalmente trabalha em centavos.
  if(n > 1000) n = n / 100;

  return n.toLocaleString("pt-BR",{
    style:"currency",
    currency:"BRL"
  });
}

function getOrderAmount(order){
  if(order.amount_cents != null)
    return Number(order.amount_cents) / 100;

  if(order.amount != null)
    return Number(order.amount);

  if(order.price != null)
    return Number(order.price);

  return 0;
}

function getProductStock(p){
  return Number(
    p.stock ??
    p.stock_count ??
    p.inventory_count ??
    p.available ??
    0
  );
}


async function login(){

  const pass = $("password").value.trim();

  if(!pass){
    $("loginError").textContent = "Digite a senha.";
    return;
  }

  ADMIN_PASSWORD = pass;

  try{

    const res = await fetch("/api/admin/products",{
      headers:{
        "x-admin-password":ADMIN_PASSWORD,
        "Cache-Control":"no-cache"
      }
    });

    if(!res.ok){
      throw new Error("Senha inválida.");
    }

    localStorage.setItem("onyx_admin_password",ADMIN_PASSWORD);

    $("login").classList.add("hidden");
    $("admin").classList.remove("hidden");

    await loadAll();

  }catch(e){

    ADMIN_PASSWORD = "";
    $("loginError").textContent = e.message || "Erro ao entrar.";

  }
}


function logout(){

  localStorage.removeItem("onyx_admin_password");
  ADMIN_PASSWORD = "";

  $("admin").classList.add("hidden");
  $("login").classList.remove("hidden");
  $("password").value = "";

}


async function api(url, options={}){

  const res = await fetch(url,{
    cache:"no-store",
    ...options,
    headers:{
      ...headers(),
      ...(options.headers || {})
    }
  });

  if(!res.ok){

    let message = "Erro na operação.";

    try{
      const data = await res.json();
      message = data.error || data.message || message;
    }catch{}

    throw new Error(message);
  }

  try{
    return await res.json();
  }catch{
    return {};
  }
}


async function loadAll(){

  try{

    const [productsData,ordersData] = await Promise.all([
      api("/api/admin/products"),
      api("/api/admin/orders")
    ]);

    products = Array.isArray(productsData)
      ? productsData
      : (productsData.products || []);

    orders = Array.isArray(ordersData)
      ? ordersData
      : (ordersData.orders || []);

    renderProducts();
    renderOrders();
    updateStats();

  }catch(e){

    alert(e.message || "Erro ao carregar o painel.");

  }

}


function renderProducts(){

  const box = $("products");

  if(!products.length){
    box.innerHTML = `<div class="empty">Nenhum produto cadastrado.</div>`;
    return;
  }

  box.innerHTML = products.map(p => {

    const id = p.id;

    const image =
      p.image_url ||
      p.image ||
      "";

    const category =
      p.category ||
      "roblox";

    const stock = getProductStock(p);

    return `
      <div class="product">

        ${
          image
          ? `<img src="${escapeHtml(image)}" onerror="this.style.display='none'">`
          : `<div style="height:150px;background:#080808;display:flex;align-items:center;justify-content:center;color:#555">SEM IMAGEM</div>`
        }

        <div class="product-body">

          <div class="product-name">
            ${escapeHtml(p.name || "Sem nome")}
          </div>

          <span class="tag">
            ${escapeHtml(category)}
          </span>

          <div class="price">
            ${money(p.price)}
          </div>

          <div class="stock">
            Estoque: ${stock}
          </div>

          ${
            p.description
            ? `<p class="muted">${escapeHtml(p.description)}</p>`
            : ""
          }

          <div class="actions">

            <button class="btn dark"
              onclick="openEditProduct('${encodeURIComponent(String(id))}')">
              Editar
            </button>

            <button class="btn dark"
              onclick="openStock('${encodeURIComponent(String(id))}')">
              Estoque
            </button>

          </div>

          <br>

          <button class="btn danger full"
            onclick="deleteProduct('${encodeURIComponent(String(id))}')">
            Excluir
          </button>

        </div>

      </div>
    `;

  }).join("");

}


function renderOrders(){

  const box = $("orders");

  if(!orders.length){
    box.innerHTML = `<div class="empty">Nenhuma venda registrada.</div>`;
    return;
  }

  box.innerHTML = orders.slice(0,50).map(order => {

    const amount = getOrderAmount(order);

    const product =
      order.product_name ||
      order.product ||
      order.name ||
      "Produto";

    const status =
      order.status ||
      "paid";

    const date =
      order.created_at ||
      order.paid_at ||
      order.updated_at;

    return `
      <div class="order">

        <div class="order-top">

          <strong>${escapeHtml(product)}</strong>

          <strong class="green">
            ${money(amount)}
          </strong>

        </div>

        <div class="muted" style="margin-top:7px">
          Status: ${escapeHtml(status)}
        </div>

        ${
          date
          ? `<div class="muted" style="margin-top:4px">
              ${formatDate(date)}
             </div>`
          : ""
        }

      </div>
    `;

  }).join("");

}


function updateStats(){

  $("statProducts").textContent = products.length;

  $("statStock").textContent =
    products.reduce((total,p) => total + getProductStock(p),0);

  $("statOrders").textContent = orders.length;

  const revenue = orders.reduce(
    (total,o) => total + getOrderAmount(o),
    0
  );

  $("statRevenue").textContent = money(revenue);

}


function openProductModal(){

  editingId = null;

  $("modalTitle").textContent = "Novo produto";
  $("productId").value = "";
  $("productName").value = "";
  $("productPrice").value = "";
  $("productCategory").value = "roblox";
  $("productImage").value = "";
  $("productDescription").value = "";

  $("deleteFromModal").classList.add("hidden");

  $("productModal").classList.add("show");

}


function openEditProduct(encodedId){

  const id = decodeURIComponent(encodedId);

  const p = products.find(x => String(x.id) === String(id));

  if(!p) return;

  editingId = id;

  $("modalTitle").textContent = "Editar produto";

  $("productId").value = id;
  $("productName").value = p.name || "";
  $("productPrice").value = p.price != null
    ? Number(p.price) > 1000
      ? Number(p.price) / 100
      : Number(p.price)
    : "";

  $("productCategory").value = p.category || "roblox";

  $("productImage").value =
    p.image_url ||
    p.image ||
    "";

  $("productDescription").value =
    p.description ||
    "";

  $("deleteFromModal").classList.remove("hidden");

  $("productModal").classList.add("show");

}


async function saveProduct(){

  const name = $("productName").value.trim();
  const price = Number($("productPrice").value);
  const category = $("productCategory").value;
  const image = $("productImage").value.trim();
  const description = $("productDescription").value.trim();

  if(!name){
    alert("Digite o nome do produto.");
    return;
  }

  if(!Number.isFinite(price) || price < 0){
    alert("Digite um preço válido.");
    return;
  }

  const payload = {
    name,
    price,
    category,
    image,
    image_url:image,
    description
  };

  try{

    if(editingId){

      await api(
        `/api/admin/products/${encodeURIComponent(editingId)}`,
        {
          method:"PUT",
          body:JSON.stringify(payload)
        }
      );

    }else{

      await api(
        "/api/admin/products",
        {
          method:"POST",
          body:JSON.stringify(payload)
        }
      );

    }

    closeModal();

    await loadAll();

  }catch(e){

    alert(e.message || "Não foi possível salvar o produto.");

  }

}


async function deleteCurrentProduct(){

  if(!editingId) return;

  await deleteProduct(
    encodeURIComponent(editingId)
  );

  closeModal();

}


async function deleteProduct(encodedId){

  const id = decodeURIComponent(encodedId);

  const p = products.find(x => String(x.id) === String(id));

  if(!confirm(
    `Excluir "${p?.name || "este produto"}"?`
  )){
    return;
  }

  try{

    await api(
      `/api/admin/products/${encodeURIComponent(id)}`,
      {
        method:"DELETE"
      }
    );

    await loadAll();

  }catch(e){

    alert(e.message || "Erro ao excluir produto.");

  }

}


function openStock(encodedId){

  const id = decodeURIComponent(encodedId);

  const select = $("stockProduct");

  select.innerHTML = products.map(p => `
    <option value="${escapeHtml(String(p.id))}"
      ${String(p.id) === String(id) ? "selected" : ""}>
      ${escapeHtml(p.name || "Produto")}
    </option>
  `).join("");

  $("stockItems").value = "";

  $("stockModal").classList.add("show");

}


async function saveStock(){

  const productId = $("stockProduct").value;

  const text = $("stockItems").value.trim();

  if(!productId){
    alert("Selecione um produto.");
    return;
  }

  if(!text){
    alert("Adicione pelo menos um item.");
    return;
  }

  const items = text
    .split(/\r?\n/)
    .map(x => x.trim())
    .filter(Boolean);

  try{

    // O backend aceita uma conta/item por requisição.
    for(const account of items){

      await api(
        "/api/admin/stock",
        {
          method:"POST",
          body:JSON.stringify({
            productId,
            account
          })
        }
      );

    }

    closeStockModal();

    await loadAll();

    alert(`${items.length} item(ns) adicionado(s) ao estoque.`);

  }catch(e){

    alert(e.message || "Erro ao adicionar estoque.");

  }

}


function closeModal(){
  $("productModal").classList.remove("show");
}

function closeStockModal(){
  $("stockModal").classList.remove("show");
}


function formatDate(value){

  const d = new Date(value);

  if(Number.isNaN(d.getTime()))
    return escapeHtml(String(value));

  return d.toLocaleString("pt-BR");

}


function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


// Se a senha já estiver salva, tenta entrar automaticamente.
if(ADMIN_PASSWORD){

  fetch("/api/admin/products",{
    headers:{
      "x-admin-password":ADMIN_PASSWORD,
      "Cache-Control":"no-cache"
    }
  })
  .then(res => {

    if(!res.ok){
      throw new Error();
    }

    $("login").classList.add("hidden");
    $("admin").classList.remove("hidden");

    return loadAll();

  })
  .catch(() => {

    localStorage.removeItem("onyx_admin_password");
    ADMIN_PASSWORD = "";

  });

}

</script>

</body>
</html>
```
